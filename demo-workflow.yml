app:
  description: '每日 AI 资讯聚合工作流 - 自动搜索、抓取和总结 AI 相关资讯'
  icon: 📰
  icon_background: '#D1E0FF'
  mode: advanced-chat
  name: AI 资讯聚合助手
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: '搜索引擎 API Key'
    id: env-apikey-001
    name: search_api_key
    value: your-search-api-key
    value_type: string
  - description: 'LLM API Key'
    id: env-llmkey-002
    name: llm_api_key
    value: your-llm-api-key
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '👋 你好！我是 AI 资讯聚合助手，请输入你想了解的关键词（每行一个），我会为你搜索最新资讯并总结。'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - GPT-5
    - AI Agent
    - 大模型
    - 机器学习
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: code
      id: start-to-code
      source: '1741660271061'
      sourceHandle: source
      target: '1741711639874'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: iteration
      id: code-to-iteration
      source: '1741711639874'
      sourceHandle: source
      target: '1719840515773'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: iteration
        targetType: template-transform
      id: iteration-to-template
      source: '1719840515773'
      sourceHandle: source
      target: '1719840940932'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: template-transform
        targetType: llm
      id: template-to-llm
      source: '1719840940932'
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: llm-to-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: '用户输入关键词列表，每行一个关键词'
        selected: false
        title: 开始
        type: start
        variables:
        - label: 关键词列表
          max_length: 1024
          options: []
          required: true
          type: paragraph
          variable: keywords
      height: 84
      id: '1741660271061'
      position:
        x: 32.5483009607201
        y: 301
      positionAbsolute:
        x: 32.5483009607201
        y: 301
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(keywords: str) -> dict:\n    \"\"\"将关键词列表转换为搜索 URL 数组\"\"\"\n    lines = [k.strip() for k in keywords.strip().split('\\n') if k.strip()]\n    # 使用 DuckDuckGo 搜索示例\n    urls = [f'https://api.duckduckgo.com/?q={k.replace(\" \", \"+\")}&format=json' for k in lines]\n    return {\n        \"urls\": urls,\n        \"count\": len(urls)\n    }"
        code_language: python3
        desc: '将用户输入的关键词转换为搜索 API 的 URL'
        outputs:
          count:
            children: null
            type: number
          urls:
            children: null
            type: array[string]
        selected: false
