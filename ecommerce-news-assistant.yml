    - data:
        code: "def main(iteration_outputs: list, analysis_type: str, time_range: str) -> dict:\n    \"\"\"\n    清洗和分类电商资讯数据\n    \"\"\"\n    import re\n    from datetime import datetime\n    \n    # 合并所有内容\n    all_content = '\\n\\n'.join(iteration_outputs)\n    \n    # 统计资讯数量\n    article_count = len([x for x in iteration_outputs if x.strip()])\n    \n    # 提取关键信息\n    urls = re.findall(r'\\*\\*链接\\*\\*: (https?://[^\\n]+)', all_content)\n    titles = re.findall(r'\\*\\*标题\\*\\*: ([^\\n]+)', all_content)\n    \n    # 生成摘要提示\n    summary_prompt = f\"\"\"\n已收集 {article_count} 篇电商资讯文章\n分析维度：{analysis_type}\n时间范围：{time_range}\n\n关键主题：\n{', '.join(titles[:10]) if titles else '待分析'}\n\n请参考以上资讯内容进行深度分析。\n\"\"\"\n    \n    return {\n        \"merged_content\": all_content,\n        \"article_count\": article_count,\n        \"unique_urls\": list(set(urls)),\n        \"titles\": titles,\n        \"summary_prompt\": summary_prompt,\n        \"analysis_type\": analysis_type,\n        \"time_range\": time_range\n    }"
        code_language: python3
