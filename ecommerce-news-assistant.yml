    - data:
        code: "def main(keywords: str, analysis_type: str, time_range: str) -> dict:\n    \"\"\"\n    生成电商资讯搜索查询\n    \"\"\"\n    # 解析关键词\n    keyword_list = [k.strip() for k in keywords.strip().split('\\n') if k.strip()]\n    \n    # 时间范围映射\n    time_map = {\n        '最近 24 小时': '24h',\n        '最近 7 天': '7d',\n        '最近 30 天': '30d'\n    }\n    time_filter = time_map.get(time_range, '7d')\n    \n    # 为每个关键词生成多个搜索查询\n    queries = []\n    for kw in keyword_list:\n        # 资讯搜索\n        queries.append(f'{kw} 最新动态 {time_filter}')\n        # 行业分析\n        if analysis_type in ['市场趋势', '全方位分析']:\n            queries.append(f'{kw} 市场趋势 分析报告')\n        # 竞品监控\n        if analysis_type in ['竞品分析', '全方位分析']:\n            queries.append(f'{kw} 竞争对手 市场份额')\n        # 价格信息\n        if analysis_type in ['价格监控', '全方位分析']:\n            queries.append(f'{kw} 价格变化 促销')\n        # 政策相关\n        if analysis_type in ['政策解读', '全方位分析']:\n            queries.append(f'{kw} 政策法规 行业政策')\n    \n    return {\n        \"queries\": queries,\n        \"keyword_count\": len(keyword_list),\n        \"query_count\": len(queries),\n        \"analysis_type\": analysis_type,\n        \"time_range\": time_range\n    }"
        code_language: python3
        desc: '根据用户输入生成多个搜索查询，覆盖不同分析维度'
