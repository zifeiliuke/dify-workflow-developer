        desc: '用户输入电商关键词，支持多个关键词（每行一个）'
        selected: false
        title: 开始
        type: start
        variables:
        - label: 电商关键词
          max_length: 512
          options: []
          required: true
          type: paragraph
          variable: keywords
          placeholder: "示例：\n淘宝直播\n京东 618\n跨境电商"
        - label: 分析维度
          max_length: 48
          options:
          - 市场趋势
          - 竞品分析
          - 价格监控
          - 政策解读
          - 全方位分析
          required: true
          type: select
          variable: analysis_type
        - label: 时间范围
          max_length: 24
          options:
          - 最近 24 小时
          - 最近 7 天
          - 最近 30 天
          required: true
          type: select
          variable: time_range
      height: 154
