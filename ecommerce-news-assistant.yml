app:
  description: '电商资讯聚合助手 - 自动搜索、抓取和分析电商行业资讯，提供市场洞察和竞争情报'
  icon: 🛒
  icon_background: '#FFE4E8'
  mode: advanced-chat
  name: 电商资讯聚合助手
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables:
  - description: '当前分析阶段'
    id: conv-stage-001
    name: analysis_stage
    selector:
    - conversation
    - analysis_stage
    value: searching
    value_type: string
  environment_variables:
  - description: '搜索引擎 API Key (如 SerpAPI)'
    id: env-search-key-001
    name: search_api_key
    value: your-search-api-key
    value_type: string
  - description: '电商数据 API Key (可选)'
    id: env-ecom-key-002
    name: ecommerce_api_key
    value: your-ecommerce-api-key
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: "👋 你好！我是电商资讯聚合助手，可以帮你：\n\n🔍 搜索电商行业资讯\n📊 分析市场趋势\n🏪 监控竞品动态\n💰 追踪价格变化\n\n请输入你想了解的电商关键词（如：淘宝、京东、直播带货、跨境电商等）"
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 淘宝直播带货趋势
    - 京东 618 活动分析
    - 跨境电商政策
    - 拼多多最新策略
    - 抖音电商发展
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
